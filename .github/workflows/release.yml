name: Publish to Thunderstore

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  thunderstore:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p release-assets
          tag="${GITHUB_REF_NAME:-${{ github.event.release.tag_name }}}"
          gh release download "$tag" \
            --repo "${{ github.repository }}" \
            --pattern "POGPOVChanger-*.zip" \
            --dir release-assets

      - name: Install Thunderstore CLI
        shell: bash
        run: |
          dotnet tool install --global tcli
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Publish to Thunderstore
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
        shell: bash
        run: |
          zip_file=$(find release-assets -name "POGPOVChanger-*.zip" | head -n 1)
          tcli publish --config-path ./thunderstore.toml --token "$TCLI_AUTH_TOKEN" --file "$zip_file"
          if [ $? -ne 0 ]; then
            echo "Failed to publish to Thunderstore"
            exit 1
          fi
          echo "Successfully published to Thunderstore"